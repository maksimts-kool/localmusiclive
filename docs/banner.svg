<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121f"/>
      <stop offset="1" stop-color="#241a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#ffc371"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" rx="20" fill="url(#bg)"/>

  <!-- TV -->
  <g transform="translate(92 48)">
    <rect x="0" y="0" width="190" height="124" rx="14" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <path d="M78 38 L78 86 L120 62 Z" fill="url(#accent)"/>
    <rect x="22" y="104" width="146" height="5" rx="2.5" fill="#ffffff" opacity="0.18"/>
    <rect x="22" y="104" width="92" height="5" rx="2.5" fill="url(#accent)"/>
    <path d="M70 140 L120 140" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="210" cy="10" r="7" fill="#ff5f6d"/>
  </g>

  <!-- Title -->
  <text x="340" y="118" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">localmusic<tspan fill="url(#accent)">live</tspan></text>
  <text x="342" y="160" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#b9b3cc">Your own 24/7 music-video channel, on every screen at home</text>
</svg>

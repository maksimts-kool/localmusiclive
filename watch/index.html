<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localmusiclive</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Inter, "Samsung One", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  body.idle { cursor: none; }
  #status {
    position: fixed;
    left: 3vw;
    bottom: 4vh;
    padding: 0.6em 1em;
    border-radius: 0.6em;
    background: rgba(14, 17, 24, 0.85);
    font-size: 2.2vh;
    opacity: 0;
    visibility: hidden;
    -webkit-transform: translate3d(0, 1vh, 0);
    transform: translate3d(0, 1vh, 0);
    -webkit-transition: opacity 0.3s ease-in, -webkit-transform 0.3s ease-in, visibility 0s linear 0.3s;
    transition: opacity 0.3s ease-in, transform 0.3s ease-in, visibility 0s linear 0.3s;
  }
  #status.on {
    opacity: 1;
    visibility: visible;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    -webkit-transition: opacity 0.3s ease-out, -webkit-transform 0.3s ease-out;
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
  }
  /* Own compositor layers, so fading these over the video doesn't repaint it
     every frame (that's what makes fades stutter on TV browsers). */
  #status, #hint, #play {
    will-change: opacity, transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  #play {
    position: fixed;
    top: 50%;
    left: 50%;
    -webkit-transform: translate3d(-50%, -50%, 0) scale(0.94);
    transform: translate3d(-50%, -50%, 0) scale(0.94);
    opacity: 0;
    visibility: hidden;
    -webkit-transition: opacity 0.25s ease-in, -webkit-transform 0.25s ease-in, visibility 0s linear 0.25s;
    transition: opacity 0.25s ease-in, transform 0.25s ease-in, visibility 0s linear 0.25s;
    padding: 0.7em 1.6em;
    border: 0.12em solid rgba(255, 255, 255, 0.4);
    border-radius: 0.6em;
    background: #ff5c7a;
    color: #fff;
    font: inherit;
    font-size: 4vh;
    font-weight: 600;
  }
  #play:focus { outline: 0.12em solid #fff; outline-offset: 0.2em; }
  #play.on {
    opacity: 1;
    visibility: visible;
    -webkit-transform: translate3d(-50%, -50%, 0) scale(1);
    transform: translate3d(-50%, -50%, 0) scale(1);
    -webkit-transition: opacity 0.3s ease-out, -webkit-transform 0.3s ease-out;
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
  }
  #hint {
    position: fixed;
    right: 3vw;
    top: 4vh;
    padding: 0.6em 1em;
    border-radius: 0.6em;
    background: rgba(14, 17, 24, 0.85);
    font-size: 2.2vh;
    opacity: 0;
    visibility: hidden;
    -webkit-transform: translate3d(0, -1vh, 0);
    transform: translate3d(0, -1vh, 0);
    -webkit-transition: opacity 0.5s ease-in, -webkit-transform 0.5s ease-in, visibility 0s linear 0.5s;
    transition: opacity 0.5s ease-in, transform 0.5s ease-in, visibility 0s linear 0.5s;
  }
  #hint.on {
    opacity: 1;
    visibility: visible;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    -webkit-transition: opacity 0.4s ease-out, -webkit-transform 0.4s ease-out;
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  #hint b { color: #ff5c7a; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<button id="play" type="button">&#9654;&nbsp; Play</button>
<div id="status"></div>
<div id="hint">Press <b>OK</b> for full screen</div>
<script src="hls.min.js"></script>
<script>
  // Written for old TV browsers (Tizen 4+): ES5, no optional chaining.
  (function () {
    var SRC = 'live/stream.m3u8';
    var video = document.getElementById('video');
    var playButton = document.getElementById('play');
    var statusBox = document.getElementById('status');
    var hintBox = document.getElementById('hint');
    var forceNative = /[?&]native=1/.test(location.search);
    var hls = null;
    var retryTimer = null;
    var lastTime = -1;
    var stalledFor = 0;

    // Keeps the old text while the box fades out, so it doesn't shrink to an
    // empty box mid-fade; only touches the DOM when something changes.
    function status(text) {
      if (text && statusBox.textContent !== text) statusBox.textContent = text;
      var cls = text ? 'on' : '';
      if (statusBox.className !== cls) statusBox.className = cls;
    }

    function play() {
      var p = video.play();
      if (p && p.then) {
        p.then(function () {
          playButton.className = '';
        }, function () {
          // Autoplay with sound blocked: one press of OK on the remote starts it.
          playButton.className = 'on';
          playButton.focus();
        });
      }
    }

    function retry(text, delay) {
      status(text);
      clearTimeout(retryTimer);
      retryTimer = setTimeout(start, delay);
    }

    function start() {
      clearTimeout(retryTimer);
      lastTime = -1;
      stalledFor = 0;
      if (hls) {
        hls.destroy();
        hls = null;
      }
      status('Connecting…');
      var url = SRC + '?t=' + Date.now();
      if (!forceNative && window.Hls && Hls.isSupported()) {
        hls = new Hls({
          // Play 4 s behind the newest video (2 segments); if it falls more than
          // 10 s behind (after a stall), jump forward instead of staying late.
          // In seconds, because counts multiply the playlist's rounded-up
          // target duration (3 s for 2 s segments cut at uneven keyframes).
          liveSyncDuration: 4,
          liveMaxLatencyDuration: 10,
          maxBufferLength: 10,
          backBufferLength: 10,
        });
        window.hlsPlayer = hls; // for checking hlsPlayer.latency from the console
        hls.on(Hls.Events.MANIFEST_PARSED, play);
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            retry('Stream offline, retrying…', 5000);
          }
        });
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.load();
        play();
      } else {
        status('This browser cannot play the stream. Try an IPTV app with /channel.m3u');
      }
    }

    video.addEventListener('playing', function () { status(''); });
    video.addEventListener('waiting', function () { status('Buffering…'); });
    video.addEventListener('error', function () {
      if (!hls) retry('Stream offline, retrying…', 5000);
    });
    video.addEventListener('ended', function () { retry('Stream ended, retrying…', 3000); });

    // Watchdog: if the picture freezes for 20 s while it should be playing, start over.
    // The TV's own player picks its start point itself; pull it back near live.
    setInterval(function () {
      if (video.paused) return;
      if (!hls && video.seekable.length) {
        var edge = video.seekable.end(video.seekable.length - 1);
        if (edge - video.currentTime > 10) video.currentTime = edge - 4;
      }
      if (video.currentTime === lastTime) {
        stalledFor += 5;
        if (stalledFor >= 20) retry('Reconnecting…', 0);
      } else {
        stalledFor = 0;
        lastTime = video.currentTime;
      }
    }, 5000);

    // Full screen. Browsers only allow it in answer to a key press or click,
    // so the first OK on the remote does it (and starts playback if needed).
    function isFullscreen() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function enterFullscreen() {
      if (isFullscreen()) return;
      var el = document.documentElement;
      var fs = el.requestFullscreen || el.webkitRequestFullscreen;
      try {
        var p = fs ? fs.call(el) : null;
        if (p && p.then) p.then(null, videoFullscreen);
        else if (!fs) videoFullscreen();
      } catch (e) {
        videoFullscreen();
      }
    }

    function videoFullscreen() {
      // Older players can only put the video itself in full screen.
      var fs = video.requestFullscreen || video.webkitRequestFullscreen || video.webkitEnterFullscreen;
      try { if (fs) fs.call(video); } catch (e) { /* not supported */ }
    }

    var hintTimer = null;
    function hint() {
      clearTimeout(hintTimer);
      hintBox.className = isFullscreen() ? '' : 'on';
      hintTimer = setTimeout(function () { hintBox.className = ''; }, 10000);
    }

    function activate() {
      enterFullscreen();
      if (video.paused) play();
    }

    document.addEventListener('fullscreenchange', hint);
    document.addEventListener('webkitfullscreenchange', hint);
    playButton.addEventListener('click', function (e) {
      e.stopPropagation();
      activate();
    });
    document.addEventListener('click', activate);

    // TV remote: OK/Enter or Play goes full screen and starts playback.
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 13 || e.keyCode === 415 || e.keyCode === 10252) {
        e.preventDefault();
        activate();
      }
    });

    // Hide the mouse pointer (or the TV's remote pointer) when it isn't moving.
    var idleTimer = null;
    document.addEventListener('mousemove', function () {
      // mousemove fires many times a second; restyling the page each time
      // makes running fades stutter.
      if (document.body.className) document.body.className = '';
      if (!isFullscreen() && hintBox.className !== 'on') hint();
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { document.body.className = 'idle'; }, 3000);
    });

    start();
    hint();
  })();
</script>
</body>
</html>

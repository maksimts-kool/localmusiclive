# ffplayout writes the stream as HLS and serves it under /public/, but as file
# downloads (application/octet-stream, Content-Disposition: attachment), which
# TV browsers and IPTV apps won't play. This passes it through with the right
# types and caching, and serves nothing else from ffplayout.

map $file $hls_type {
    ~\.m3u8$ application/vnd.apple.mpegurl;
    default video/mp2t;
}
map $file $hls_cache {
    ~\.m3u8$ "no-cache";
    default "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, so a recreated ffplayout container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /hls.min.js {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ "^/live/(?<file>[A-Za-z0-9_-]+\.(m3u8|ts))$" {
        set $ffplayout ffplayout:8787;
        proxy_pass http://$ffplayout/public/1/live/$file;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        add_header Content-Type $hls_type always;
        add_header Cache-Control $hls_cache always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # One-channel playlist for TV IPTV apps that ask for an M3U URL.
    location = /channel.m3u {
        default_type audio/x-mpegurl;
        add_header Cache-Control "no-cache";
        return 200 "#EXTM3U\n#EXTINF:-1 tvg-id=\"localmusiclive\" tvg-name=\"localmusiclive\",localmusiclive\nhttp://$http_host/live/stream.m3u8\n";
    }

    location / {
        return 404;
    }
}
